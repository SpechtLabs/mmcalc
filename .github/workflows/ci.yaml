name: CI

# Everything a pull request runs. The checks are a workflow of their own,
# typescript.yaml, which also runs on its own from the Actions tab.
on:
  # Skip changes that only touch documentation. The filter excludes rather
  # than lists, so a new source directory or config file runs CI by default.
  # No check is required by the rulesets, which is what makes a workflow-level
  # filter safe: a skipped required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
  # Vercel deploys main as it is pushed, so main runs the same checks: its
  # status shows whether what's live passed them, and its runs save the
  # caches every pull request restores (a pull request's caches are its own).
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight. Runs on main
# each finish, so every commit there gets a status.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: TypeScript
    uses: ./.github/workflows/typescript.yaml
